 Ранвье.", "diagram": "neuron"}, {"text": "Как называется контакт, через который нейрон передаёт сигнал другой клетке?", "options": ["Синапс", "Капилляр", "Альвеола", "Сухожилие"], "explanation": "В синапсе нервная клетка взаимодействует с другим нейроном, мышечной или железистой клеткой.", "diagram": ""}, {"text": "Какой нейрон проводит сигналы от рецепторов к центральной нервной системе?", "options": ["Чувствительный", "Двигательный", "Только вставочный", "Любой нейрон только от мышц"], "explanation": "Чувствительные, или афферентные, нейроны передают информацию от рецепторов в ЦНС.", "diagram": ""}, {"text": "Какой нейрон передаёт команду от ЦНС к скелетной мышце?", "options": ["Двигательный", "Чувствительный", "Только вставочный", "Рецепторный белок"], "explanation": "Двигательные, или эфферентные, нейроны передают сигналы к исполнительным органам, в том числе мышцам.", "diagram": ""}, {"text": "Выберите верное утверждение о нервной ткани.", "options": ["Нейроглия поддерживает работу нейронов", "Нейроны не имеют мембраны", "Все нейроны лишены ядра", "Миелин находится внутри ядра"], "explanation": "Клетки нейроглии выполняют опорные, защитные и другие функции. Некоторые из них образуют миелиновую оболочку.", "diagram": ""}], "medium": [{"text": "Выберите типичную последовательность прохождения сигнала через нейрон.", "options": ["Дендриты → тело → аксон → окончания", "Аксон → ядро → миелин → дендриты", "Окончания → миелин → ядро → кровь", "Тело → дендриты → миелин → ядро"], "explanation": "В типичной схеме входящие сигналы поступают на дендриты и тело клетки; потенциал действия возникает в начальном участке аксона и идёт к его окончаниям.", "diagram": "neuron"}, {"text": "Установите соответствие: 1 — дендрит, 2 — аксон, 3 — миелин. Функции: а — изоляция, б — приём сигналов, в — проведение к окончаниям.", "options": ["1–б, 2–в, 3–а", "1–в, 2–а, 3–б", "1–а, 2–б, 3–в", "1–б, 2–а, 3–в"], "explanation": "Дендриты обычно принимают сигналы, аксон проводит импульс к окончаниям, миелин обеспечивает электрическую изоляцию.", "diagram": ""}, {"text": "Как называются промежутки между соседними участками миелина?", "options": ["Перехваты Ранвье", "Дендритные шипики", "Синаптические пузырьки", "Ядрышки"], "explanation": "В перехватах Ранвье мембрана аксона не покрыта миелином; здесь потенциал действия возобновляется.", "diagram": "neuron"}, {"text": "Что переносит сигнал через щель химического синапса?", "options": ["Нейромедиатор", "Эритроцит", "Молекула ДНК", "Целый нервный импульс как частица"], "explanation": "Вещество-посредник выделяется из пресинаптического окончания и связывается с рецепторами постсинаптической мембраны.", "diagram": "synapse"}, {"text": "Упорядочьте события химической передачи: 1 — связывание с рецепторами, 2 — приход импульса, 3 — выделение медиатора.", "options": ["2 → 3 → 1", "1 → 2 → 3", "3 → 1 → 2", "2 → 1 → 3"], "explanation": "Приход импульса запускает процессы выделения медиатора. Затем медиатор проходит через щель и действует на рецепторы.", "diagram": "synapse"}, {"text": "Ученик сказал: «Миелин образуется из ядра аксона». Как исправить ошибку?", "options": ["Миелин образуют глиальные клетки; ядро нейрона находится в соме", "Миелин образуют эритроциты", "В каждом участке аксона есть отдельное ядро", "Миелин — это синаптическая жидкость"], "explanation": "Миелин формируется клетками глии: шванновскими клетками в периферической нервной системе и олигодендроцитами в ЦНС.", "diagram": ""}, {"text": "Какую роль выполняет вставочный нейрон?", "options": ["Связывает нейроны и обрабатывает сигналы в ЦНС", "Переносит кислород к мышцам", "Образует кости", "Всегда передаёт сигналы только от кожи к ЦНС"], "explanation": "Вставочные нейроны участвуют в передаче и обработке информации внутри центральной нервной системы.", "diagram": ""}, {"text": "Выберите путь сигнала в рефлексе отдёргивания руки от горячего предмета.", "options": ["Рецептор → чувствительный → вставочный → двигательный нейрон → мышца", "Мышца → двигательный → рецептор → чувствительный нейрон", "Рецептор → мышца → вставочный нейрон → кожа", "Двигательный → чувствительный нейрон → рецептор → мышца"], "explanation": "В этом защитном рефлексе сигнал от рецепторов через чувствительный нейрон поступает в спинной мозг, переключается через вставочные нейроны на двигательные и достигает мышц.", "diagram": ""}, {"text": "Чем химический синапс отличается от проведения по аксону?", "options": ["В щели действует медиатор, по аксону распространяется электрический сигнал", "В щели движутся ядра клеток", "По аксону течёт кровь", "Оба процесса являются переносом целых нейронов"], "explanation": "Потенциал действия распространяется по мембране аксона. В химическом синапсе электрический сигнал преобразуется в химический, а затем вызывает ответ другой клетки.", "diagram": "synapse"}, {"text": "Почему химический синапс обычно передаёт сигнал в одном направлении?", "options": ["Выделение медиатора и принимающие рецепторы расположены по разные стороны", "В щели стоит механический клапан", "Аксон всегда толще дендрита", "Медиатор движется только под действием силы тяжести"], "explanation": "Пресинаптическое окончание выделяет медиатор, а постсинаптическая мембрана несёт воспринимающие его рецепторы. Такая организация задаёт направление передачи.", "diagram": ""}], "hard": [{"text": "Миелин повреждён, но аксон сохранился. Какое последствие наиболее вероятно?", "options": ["Замедление или нарушение проведения импульсов", "Обязательное удвоение скорости", "Превращение аксона в дендрит", "Мгновенное образование нового ядра"], "explanation": "Потеря изоляции нарушает быстрое проведение между перехватами Ранвье; сигнал может замедляться или блокироваться.", "diagram": ""}, {"text": "В опыте заблокированы рецепторы медиатора на постсинаптической мембране. Что ожидается?", "options": ["Медиатор может выделиться, но обычный ответ на него снизится или исчезнет", "Аксон обязательно перестанет иметь мембрану", "Нейрон начнёт переносить кислород держки последовательных синапсов складываются: 4 × 0,5 = 2 мс. Это только синаптическая задержка, без времени проведения по аксонам.", "diagram": ""}, {"text": "Ученик утверждает: «Любой сигнал на дендрите обязательно вызывает импульс в аксоне». Что верно?", "options": ["Нужна достаточная сумма воздействий для достижения порога", "Любой сигнал всегда вызывает десять импульсов", "Дендриты вообще не получают сигналов", "Порог определяется только длиной дендрита"], "explanation": "Возбуждающие и тормозные влияния суммируются. Потенциал действия возникает при достижении порога в области его запуска.", "diagram": ""}, {"text": "Медиатор перестал быстро удаляться из синаптической щели. Каков наиболее прямой возможный эффект?", "options": ["Более длительное воздействие на рецепторы", "Автоматическое исчезновение аксона", "Немедленное превращение медиатора в миелин", "Полное прекращение обмена веществ всех клеток"], "explanation": "Удаление, обратный захват или расщепление медиатора ограничивают длительность его действия. Нарушение удаления может продлить действие; эффект зависит от типа медиатора и рецептора.", "diagram": ""}, {"text": "Найдите научно корректный вывод.", "options": ["Один нейрон может получать и возбуждающие, и тормозные сигналы", "Все синапсы всегда возбуждают клетку", "Каждый нейрон связан только с одним соседом", "Тормозный сигнал означает гибель нейрона"], "explanation": "Нейрон объединяет множество входящих воздействий. Торможение — нормальный механизм регуляции активности, а не признак гибели клетки.", "diagram": ""}]};
function shuffle(a,rng=Math.random){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function getQuestions(level,rng=Math.random){return BANK[level].map((q,i)=>{const answer=q.options[0],options=shuffle(q.options,rng);return {...q,id:level+'-'+i,answer,options,correctIndex:options.indexOf(answer)}})}
function totalTime(team){return team.answers.reduce((s,a)=>s+a.ms,0)}
function totalCorrect(team){return team.answers.filter(a=>a.correct).length}
function rankTeams(teams,rule){const rows=teams.map((team,i)=>({team,index:i,time:totalTime(team),correct:totalCorrect(team)}));const compare=(a,b)=>(rule==='accuracy'?(b.correct-a.correct):0)||(Math.round(a.time/10)-Math.round(b.time/10));rows.sort((a,b)=>compare(a,b)||a.index-b.index);let rank=1;return rows.map((r,i)=>{if(i&&compare(rows[i-1],r)!==0)rank=i+1;return{...r,rank}})}
class Game{
 constructor(names,level,rule,now=0,rng=Math.random){this.level=level;this.rule=rule;this.questions=getQuestions(level,rng);this.teams=names.map((name,i)=>({name,color:COLORS[i],answers:[]}));this.index=0;this.phase='question';this.startedAt=now;this.pauseStarted=null;this.pauseTotal=0;this.paused=false;this.completedElapsed=0}
 elapsed(now){if(this.phase!=='question')return this.completedElapsed;return Math.max(0,(this.paused?this.pauseStarted:now)-this.startedAt-this.pauseTotal)}
 answer(teamIndex,choice,now){if(this.phase!=='question'||this.paused||!Number.isInteger(choice)||choice<0||choice>3)return false;const team=this.teams[teamIndex];if(!team||team.answers.length>this.index)return false;team.answers.push({choice,correct:choice===this.questions[this.index].correctIndex,ms:this.elapsed(now)});if(this.teams.every(t=>t.answers.length>this.index)){this.completedElapsed=this.elapsed(now);this.phase='reveal'}return true}
 pause(now){if(this.phase!=='question'||this.paused)return false;this.pauseStarted=now;this.paused=true;return true}
 resume(now){if(!this.paused)return false;this.pauseTotal+=Math.max(0,now-this.pauseStarted);this.pauseStarted=null;this.paused=false;return true}
 next(now){if(this.phase!=='reveal')return false;if(this.index===9){this.phase='results';return true}this.index++;this.phase='question';this.startedAt=now;this.pauseStarted=null;this.pauseTotal=0;this.paused=false;this.completedElapsed=0;return true}
}

function esc(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return esc(v)}
function plain(v){return v}
function expr(q){return esc(q.text)}
function fmtTime(ms,precise=false){let cs=Math.round(ms/10);const m=Math.floor(cs/6000);cs%=6000;const s=Math.floor(cs/100);const part=cs%100;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+(precise?','+String(part).padStart(2,'0'):','+Math.floor(part/10))}

function announce(text){document.getElementById('announcer').textContent=text}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4200)}
function saveSettings(){try{localStorage.setItem('neuron-rally-settings-v1',JSON.stringify(settings))}catch(e){}}
function restoreSettings(){try{const s=JSON.parse(localStorage.getItem('neuron-rally-settings-v1'));if(s&&Number.isInteger(s.count)&&s.count>=1&&s.count<=6&&LEVELS[s.level]&&['time','accuracy'].includes(s.rule)&&Array.isArray(s.names)&&s.names.length===6&&s.names.every(x=>typeof x==='string'&&x.length<=24))settings=s}catch(e){}}
function footer(){return '<div class="page-foot"><span>Строение и функции нейрона · Тарасов М.С.</span><span>Сначала думаем. Потом нажимаем.</span></div>'}
function renderSetup(){clearInterval(ticker);document.getElementById('app').innerHTML='<section class="setup-grid fade-in"><div class="intro"><div class="eyebrow">Командная биологическая игра</div><h1>Нейроны<br><em>на старте.</em></h1><p class="subtitle">Строение и функции нейрона. От первого сигнала — до командной победы.</p><div class="chips"><span class="chip">8–9 классы</span><span class="chip">10 вопросов</span><span class="chip">1–6 групп</span></div><div class="intro-art" aria-hidden="true">'+neuronSVG(false)+'<div class="art-caption">Думай. Передавай. Побеждай.</div></div><div class="intro-rules"><div class="intro-rule"><span class="rule-number">1</span><div><b>Решайте вместе</b><p>Одно задание и четыре варианта для всех групп.</p></div></div><div class="intro-rule"><span class="rule-number">2</span><div><b>Дайте сигнал учителю</b><p>Учитель сразу отмечает ответ на панели вашей группы.</p></div></div><div class="intro-rule"><span class="rule-number">3</span><div><b>Сравните результат</b><p>После 10 вопросов — зачёт и время каждой группы.</p></div></div></div></div><form class="setup-card" id="setupForm"><div class="card-heading"><h2>Настроим игру</h2><span class="step-tag">ПЕРЕД СТАРТОМ</span></div><span class="field-label" id="levelLabel">Уровень сложности</span><div class="difficulty" role="group" aria-labelledby="levelLabel">'+Object.keys(LEVELS).map(k=>'<button type="button" data-level="'+k+'" aria-pressed="'+(settings.level===k)+'">'+LEVELS[k].name+'</button>').join('')+'</div><p class="level-description" id="levelDescription">'+LEVELS[settings.level].description+'</p><div class="group-head"><span class="field-label" style="margin:0">Количество групп</span><div class="stepper"><button type="button" id="lessGroups" aria-label="Уменьшить количество групп" '+(settings.count===1?'disabled':'')+'>−</button><output id="groupCount" aria-live="polite">'+settings.count+'</output><button type="button" id="moreGroups" aria-label="Увеличить количество групп" '+(settings.count===6?'disabled':'')+'>+</button></div></div><div class="groups-inputs" id="groupInputs"></div><p id="namesError" class="names-error" role="alert" hidden></p><label class="field-label" for="winRule">Как определяем победителя?</label><select class="win-select" id="winRule"><option value="time" '+(settings.rule==='time'?'selected':'')+'>По суммарному времени ответов</option><option value="accuracy" '+(settings.rule==='accuracy'?'selected':'')+'>Сначала точность, затем время</option></select><p class="setting-help" id="ruleHelp"></p><button type="submit" class="primary start-btn">Начать игру <span aria-hidden="true">→</span></button><div class="setup-foot"><span>Ответ фиксируется сразу и скрыт до проверки.</span><button type="button" class="text-btn" id="downloadHTML">Скачать HTML</button></div></form></section>'+footer();renderNameInputs();updateRuleHelp();document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{settings.level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.level===settings.level));document.getElementById('levelDescription').textContent=LEVELS[settings.level].description;saveSettings()}));document.getElementById('lessGroups').onclick=()=>changeCount(-1);document.getElementById('moreGroups').onclick=()=>changeCount(1);document.getElementById('winRule').onchange=e=>{settings.rule=e.target.value;updateRuleHelp();saveSettings()};document.getElementById('setupForm').onsubmit=startGame;document.getElementById('downloadHTML').onclick=downloadHTML}
function renderNameInputs(){document.getElementById('groupInputs').innerHTML=settings.names.slice(0,settings.count).map((name,i)=>'<label class="name-field" style="--team:'+COLORS[i]+'"><span class="color-dot" aria-hidden="true"></span><span class="sr-only">Название группы '+(i+1)+'</span><input name="group'+i+'" data-group="'+i+'" value="'+esc(name)+'" maxlength="24" autocomplete="off" placeholder="Команда '+(i+1)+'" required></label>').join('');document.querySelectorAll('[data-group]').forEach(el=>el.addEventListener('input',()=>{settings.names[+el.dataset.group]=el.value;saveSettings();document.getElementById('namesError').hidden=true}))}
function changeCount(delta){settings.count=Math.max(1,Math.min(6,settings.count+delta));renderNameInputs();document.getElementById('groupCount').textContent=settings.count;document.getElementById('lessGroups').disabled=settings.count===1;document.getElementById('moreGroups').disabled=settings.count===6;document.getElementById('namesError').hidden=true;saveSettings()}
function updateRuleHelp(){document.getElementById('ruleHelp').textContent=settings.rule==='time'?'Побеждает самое маленькое время за 10 ответов. Верные и неверные ответы учитываются по времени одинаково.':'Больше верных ответов — выше место. При равенстве побеждает группа с меньшим временем.'}
function startGame(e){e.preventDefault();const names=settings.names.slice(0,settings.count).map(s=>s.trim());const err=document.getElementById('namesError');if(names.some(s=>!s)){err.textContent='Введите название каждой группы.';err.hidden=false;return}if(new Set(names.map(s=>s.toLocaleLowerCase('ru'))).size!==names.length){err.textContent='Названия групп должны отличаться.';err.hidden=false;return}names.forEach((n,i)=>settings.names[i]=n);saveSettings();game=new Game(names,settings.level,settings.rule,performance.now());renderGame();clearInterval(ticker);ticker=setInterval(updateTimers,80);announce('Игра началась. Вопрос 1 из 10.');window.scrollTo({top:0});beep('start')}
function renderTeam(t,i,reveal){const a=t.answers[game.index];let content;if(!a){content='<div class="team-choices" role="group" aria-label="Ответы группы '+esc(t.name)+'">'+LETTERS.map((l,j)=>'<button type="button" data-team="'+i+'" data-choice="'+j+'" aria-label="'+esc(t.name)+': ответ '+l+'">'+l+'</button>').join('')+'</div>'}else if(!reveal){content='<div class="team-accepted">✓ Ответ принят</div>'}else{content='<div class="team-result '+(a.correct?'':'wrong')+'">'+(a.correct?'✓ Верно':'✕ Неверно')+' · '+LETTERS[a.choice]+'<span style="margin-left:auto;font-variant-numeric:tabular-nums">'+fmtTime(a.ms)+'</span></div>'}return '<article class="team-card" style="--team:'+t.color+'"><div class="team-heading"><span class="color-dot" aria-hidden="true"></span><span>'+esc(t.name)+'</span></div><div class="team-caption">'+(reveal?'<span>Верных: '+totalCorrect(t)+' из '+(game.index+1)+'</span><span>Время ответа</span>':a?'<span>Ждём остальные группы</span><span>'+fmtTime(a.ms)+'</span>':'<span>Выберите один ответ</span><span class="team-live-clock" aria-hidden="true">'+fmtTime(game.elapsed(performance.now()))+'</span>')+'</div>'+content+'</article>'}
function renderGame(){if(game.phase==='results'){renderResults();return}const q=game.questions[game.index],reveal=game.phase==='reveal',count=game.teams.filter(t=>t.answers.length>game.index).length;document.getElementById('app').innerHTML='<section class="fade-in" aria-label="Игровое поле"><div class="game-top"><div class="game-labels"><h2>Вопрос '+(game.index+1)+' <span class="muted">/ 10</span></h2><span class="pill">'+LEVELS[game.level].name+'</span><div class="question-dots" aria-hidden="true">'+game.questions.map((_,i)=>'<i class="q-dot '+(i<game.index?'done':i===game.index?'current':'')+'"></i>').join('')+'</div></div><div class="game-actions"><button type="button" class="secondary" id="pauseBtn" aria-label="Пауза" '+(reveal?'disabled':'')+'>'+ICONS.pause+'Пауза</button><button type="button" class="secondary" id="restartBtn" aria-label="Новая игра">'+ICONS.restart+'Заново</button></div></div><div class="question-panel"><div><div class="question-title">'+(q.diagram?'Исследуйте схему · выберите ответ':'Обсудите · выберите один ответ')+'</div><div class="expression">'+expr(q)+'</div>'+(q.diagram?diagram(q.diagram):'')+'</div><div class="question-clock"><span>'+(reveal?'Ответы получены':'Время вопроса')+'</span><strong class="clock-value" id="questionTime">'+fmtTime(game.elapsed(performance.now()))+'</strong><small>Для каждой группы<br>время фиксируется отдельно</small></div></div><div class="answers" aria-label="Варианты ответа">'+q.options.map((v,j)=>'<div class="answer-tile '+(reveal&&j===q.correctIndex?'correct':'')+'"><span class="answer-letter">'+LETTERS[j]+'</span><div class="answer-number math">'+num(v)+'</div>'+(reveal&&j===q.correctIndex?'<span class="correct-mark" aria-label="Правильный ответ">✓</span>':'')+'</div>').join('')+'</div><div class="teams-heading"><h3>Ответы групп</h3><span id="responseProgress">Ответили '+count+' из '+game.teams.length+'</span></div><div class="teams-grid count-'+game.teams.length+'" id="teamPanels">'+game.teams.map((t,i)=>renderTeam(t,i,reveal)).join('')+'</div>'+(reveal?'<section class="reveal-box"><div class="reveal-title">✓ Правильный ответ: '+LETTERS[q.correctIndex]+'<small>Время разбора не учитывается</small></div>'+solution(q)+'</section>':'')+'<div class="bottom-bar"><p>'+(reveal?'Обсудите решение. Следующий вопрос откроется, когда учитель нажмёт кнопку.':'Учитель отмечает ответы сразу после сигнала групп. Выбранные буквы откроются после ответа всех групп.')+'</p><button type="button" class="primary" id="nextBtn" '+(reveal?'':'disabled')+'>'+(game.index===9?'Показать итоги':'Следующий вопрос')+' <span aria-hidden="true">→</span></button></div></section>';bindGame();updateTimers()}
function bindGame(){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.team,+b.dataset.choice));document.getElementById('pauseBtn').onclick=()=>pauseGame();document.getElementById('restartBtn').onclick=requestReset;document.getElementById('nextBtn').onclick=()=>{if(game.next(performance.now())){renderGame();window.scrollTo({top:0});if(game.phase!=='results'){announce('Вопрос '+(game.index+1)+' из 10.');beep('start')}}}}
function choose(team,choice){const prevPhase=game.phase;if(!game.answer(team,choice,performance.now()))return;if(prevPhase!==game.phase){renderGame();announce('Все группы ответили. Правильный ответ: '+LETTERS[game.questions[game.index].correctIndex]+'.');beep('reveal')}else{document.querySelectorAll('.team-card')[team].outerHTML=renderTeam(game.teams[team],team,false);document.getElementById('responseProgress').textContent='Ответили '+game.teams.filter(t=>t.answers.length>game.index).length+' из '+game.teams.length;announce('Ответ группы '+game.teams[team].name+' принят.')}}
function updateTimers(){if(!game||game.phase!=='question'||game.paused)return;const text=fmtTime(game.elapsed(performance.now()));const clock=document.getElementById('questionTime');if(clock)clock.textContent=text;document.querySelectorAll('.team-live-clock').forEach(el=>el.textContent=text)}
function pauseGame(){if(!game.pause(performance.now()))return;const shield=document.createElement('div');shield.id='pauseOverlay';shield.className='paused-shield';shield.setAttribute('role','dialog');shield.setAttribute('aria-modal','true');shield.setAttribute('aria-label','Игра приостановлена');shield.innerHTML='<div class="pause-inner"><div class="pause-symbol" aria-hidden="true">Ⅱ</div><h2>Пауза для всех</h2><p>Таймеры остановлены. После продолжения каждая группа сможет закончить свой ответ.</p><button type="button" class="primary yellow" id="resumeBtn">Продолжить игру →</button></div>';document.getElementById('app').inert=true;document.body.appendChild(shield);document.getElementById('resumeBtn').onclick=resumeGame;document.getElementById('resumeBtn').focus();announce('Пауза. Время не учитывается.')}
function resumeGame(){game.resume(performance.now());document.getElementById('pauseOverlay')?.remove();document.getElementById('app').inert=false;document.getElementById('pauseBtn')?.focus();announce('Игра продолжается.')}
function requestReset(){dialogPaused=game?.phase==='question'&&!game.paused;if(dialogPaused)game.pause(performance.now());document.getElementById('resetDialog').showModal()}
function cancelReset(){document.getElementById('resetDialog').close();if(dialogPaused)game.resume(performance.now());dialogPaused=false}
function confirmReset(){document.getElementById('resetDialog').close();document.getElementById('pauseOverlay')?.remove();document.getElementById('app').inert=false;game=null;dialogPaused=false;clearInterval(ticker);renderSetup();window.scrollTo({top:0});announce('Настройки новой игры.')}
function trophy(){return '<svg class="trophy-art" viewBox="0 0 120 140" fill="none" aria-hidden="true"><path d="M28 17h64v35c0 25-14 39-32 39S28 77 28 52V17Z" fill="#181b20"/><path d="M28 29H12v12c0 22 10 29 28 29M92 29h16v12c0 22-10 29-28 29" stroke="#181b20" stroke-width="8"/><path d="M60 88v28m-24 10h48" stroke="#181b20" stroke-width="12"/><path d="m60 33 6 13 14 2-10 10 2 15-12-7-13 7 3-15-11-10 15-2 6-13Z" fill="#ffe149"/><path d="m11 95 8-5m84 2 6 6M8 10l8 6m90-6-6 7" stroke="#e64a3f" stroke-width="5" stroke-linecap="round"/></svg>'}
function renderResults(){clearInterval(ticker);const rows=rankTeams(game.teams,game.rule),winners=rows.filter(r=>r.rank===1),winnerNames=winners.map(r=>esc(r.team.name)).join(', ');document.getElementById('app').innerHTML='<section class="fade-in"><div class="results-hero"><div><div class="eyebrow">Финиш · 10 из 10 вопросов</div><h1>'+(winners.length>1?'Совместная победа!':'Есть победитель!')+'</h1><p><strong>'+winnerNames+'</strong>'+(game.rule==='time'?' — '+(winners.length>1?'лучшее общее время.':'самое маленькое общее время.'):' — '+(winners.length>1?'одинаковый лучший результат.':'лучший результат по точности и времени.'))+'</p></div>'+trophy()+'</div><div class="results-title"><h2>Командный зачёт</h2><div class="results-actions"><button type="button" class="secondary" id="exportResults">Скачать результаты</button><button type="button" class="primary" id="newGame">Новая игра</button></div></div><div class="table-scroll"><table class="rank-table"><thead><tr><th>Место</th><th>Группа</th><th>Верно</th><th>Ошибки</th><th>Время за 10 ответов</th></tr></thead><tbody>'+rows.map(r=>'<tr class="'+(r.rank===1?'winner':'')+'"><td><span class="rank-no">'+String(r.rank).padStart(2,'0')+'</span>'+(r.rank===1?' ★':'')+'</td><td><span class="team-name-inline" style="--team:'+r.team.color+'"><i class="color-dot" aria-hidden="true"></i>'+esc(r.team.name)+'</span></td><td>'+r.correct+' / 10</td><td>'+(10-r.correct)+'</td><td><span class="time-total">'+fmtTime(r.time,true)+'</span></td></tr>').join('')+'</tbody></table></div><p class="rank-note">'+(game.rule==='time'?'Зачёт по скорости: сравнивается сумма времени всех 10 ответов, включая неверные.':'Зачёт по точности: сначала сравнивается число верных ответов, затем суммарное время.')+' Паузы и разборы исключены. При равенстве до 0,01 секунды — совместное место.</p><h2 class="review-heading">Разбор всех заданий</h2><div class="review-list">'+game.questions.map((q,j)=>'<details class="review-item"><summary><span class="review-label"><span class="review-number">'+String(j+1).padStart(2,'0')+'</span><span class="review-equation math">'+expr(q)+'</span></span><span class="review-meta">Верно: '+game.teams.filter(t=>t.answers[j].correct).length+' из '+game.teams.length+'</span></summary><div class="review-body">'+solution(q)+'<div class="review-teams">'+game.teams.map(t=>'<div class="review-team"><strong>'+esc(t.name)+'</strong><br><span class="'+(t.answers[j].correct?'success':'danger')+'">'+(t.answers[j].correct?'✓ Верно':'✕ Ошибка')+'</span> · ответ '+LETTERS[t.answers[j].choice]+' · '+plain(q.options[t.answers[j].choice])+'<br>Время: '+fmtTime(t.answers[j].ms,true)+'</div>').join('')+'</div></div></details>').join('')+'</div>'+footer()+'</section>';document.getElementById('newGame').onclick=requestReset;document.getElementById('exportResults').onclick=exportResults;announce('Игра окончена. Победители: '+winners.map(r=>r.team.name).join(', '));celebrate();beep('win')}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function downloadHTML(){const html='<!doctype html>\n'+document.documentElement.outerHTML;downloadBlob(new Blob([html],{type:'text/html;charset=utf-8'}),'Neirony_na_starte.html');toast('HTML-файл готов. Откройте его в браузере — интернет не нужен.')}
function csvCell(v){let s=String(v);if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportResults(){if(game?.phase!=='results')return;const rows=[['Нейроны на старте · '+LEVELS[game.level].name],['Правило',game.rule==='time'?'По суммарному времени':'Сначала точность, затем время'],['Место','Группа','Верно','Ошибки','Время, секунд']];rankTeams(game.teams,game.rule).forEach(r=>rows.push([r.rank,r.team.name,r.correct,10-r.correct,(r.time/1000).toFixed(2).replace('.',',')]));rows.push([],['Вопрос','Группа','Задание','Ответ','Верно','Время, секунд']);game.questions.forEach((q,j)=>game.teams.forEach(t=>{const a=t.answers[j];rows.push([j+1,t.name,q.text,plain(q.options[a.choice]),a.correct?'Да':'Нет',(a.ms/1000).toFixed(2).replace('.',',')])}));downloadBlob(new Blob(['\uFEFF'+rows.map(row=>row.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'Rezultaty_neirony.csv')}
function beep(type){if(!sound)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const tones=type==='win'?[523,659,784,1047]:type==='reveal'?[660,880]:[440];tones.forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.2)})}catch(e){}}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const box=document.createElement('div');box.className='confetti';box.setAttribute('aria-hidden','true');box.innerHTML=Array.from({length:48},(_,i)=>'<i style="left:'+Math.random()*100+'%;background:'+['#ffe149','#e64a3f','#181b20','#3b8b73'][i%4]+';animation-delay:'+Math.random()*.7+'s"></i>').join('');document.body.appendChild(box);setTimeout(()=>box.remove(),4200)}
function boot(){restoreSettings();document.getElementById('soundBtn').innerHTML=ICONS.mute;document.getElementById('fullBtn').innerHTML=ICONS.full;document.getElementById('soundBtn').onclick=()=>{sound=!sound;const b=document.getElementById('soundBtn');b.innerHTML=sound?ICONS.sound:ICONS.mute;b.setAttribute('aria-pressed',sound);b.setAttribute('aria-label',sound?'Выключить звук':'Включить звук');b.title=sound?'Выключить звук':'Включить звук';b.classList.toggle('on',sound);if(sound)beep('start')};document.getElementById('fullBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Для полного экрана используйте кнопку браузера или клавишу F11.')}catch(e){toast('Полный экран недоступен здесь. Откройте HTML в отдельном окне браузера.')}};document.getElementById('cancelReset').onclick=cancelReset;document.getElementById('confirmReset').onclick=confirmReset;document.getElementById('resetDialog').addEventListener('cancel',e=>{e.preventDefault();cancelReset()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&game?.paused&&document.getElementById('pauseOverlay'))resumeGame()});renderSetup()}

function neuronSVG(labels=true){return `<svg class="neuron-diagram" viewBox="0 0 760 210" role="img" aria-label="Схема нейрона: 1 — ветвящиеся отростки слева, 2 — центральная часть клетки, 3 — длинный отросток, 4 — оболочки длинного отростка, 5 — концевые ветви"><g fill="none" stroke="#181b20" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M148 98 100 65 62 62M100 65 88 25M145 112 85 120 45 153M85 120 48 104M153 131 118 171 80 188M118 171 125 195M168 85 162 47 134 24M162 47 192 25"/><path d="M209 112 C290 110 310 135 370 118 S520 110 608 111 L650 90 690 55M650 90 708 92M608 111 657 140 701 166M657 140 710 134"/></g><path d="M143 90 Q158 68 181 81 Q201 79 210 103 Q234 113 209 128 Q197 149 174 138 Q142 151 140 124 Q123 106 143 90Z" fill="#e64a3f" stroke="#181b20" stroke-width="3"/><circle cx="176" cy="111" r="13" fill="#ffe149" stroke="#181b20" stroke-width="3"/><g fill="#fff" stroke="#181b20" stroke-width="3"><rect x="269" y="103" width="58" height="29" rx="14" transform="rotate(10 295 117)"/><rect x="345" y="105" width="58" height="29" rx="14" transform="rotate(-10 370 120)"/><rect x="425" y="94" width="58" height="29" rx="14"/><rect x="505" y="95" width="58" height="29" rx="14"/></g><g fill="#e64a3f"><circle cx="690" cy="55" r="7"/><circle cx="708" cy="92" r="7"/><circle cx="701" cy="166" r="7"/><circle cx="710" cy="134" r="7"/></g>${labels?'<g font-size="21" font-weight="800" text-anchor="middle" fill="#181b20"><text x="53" y="32">1</text><text x="183" y="181">2</text><text x="338" y="176">3</text><text x="451" y="73">4</text><text x="732" y="112">5</text></g>':'<circle r="7" fill="#e64a3f"><animateMotion dur="3s" repeatCount="indefinite" path="M220 112 C290 110 310 135 370 118 S520 110 608 111 L650 90 690 55"/></circle>'}</svg>`}
function diagram(kind){if(kind==='neuron')return '<div class="diagram-wrap">'+neuronSVG()+'<small>Условная схема; масштаб не соблюдён.</small></div>';return `<div class="diagram-wrap"><svg viewBox="0 0 760 190" role="img" aria-label="Химический синапс: сверху окончание аксона с пузырьками, между мембранами щель, снизу рецепторы другой клетки"><path d="M210 10V55Q145 128 260 128H500Q615 128 550 55V10" fill="#f7b0a6" stroke="#181b20" stroke-width="3"/><path d="M155 164H605V187H155Z" fill="#fff" stroke="#181b20" stroke-width="3"/><g fill="#ffe149" stroke="#181b20" stroke-width="2"><circle cx="280" cy="75" r="16"/><circle cx="350" cy="91" r="16"/><circle cx="435" cy="65" r="16"/><circle cx="490" cy="95" r="16"/></g><g fill="#e64a3f"><circle cx="278" cy="74" r="4"/><circle cx="347" cy="91" r="4"/><circle cx="433" cy="65" r="4"/><circle cx="490" cy="95" r="4"/><circle cx="310" cy="143" r="4"/><circle cx="400" cy="144" r="4"/><circle cx="470" cy="141" r="4"/></g><g fill="none" stroke="#14724c" stroke-width="6"><path d="M300 155v12h18v-12M390 155v12h18v-12M460 155v12h18v-12"/></g><g font-size="15" fill="#181b20"><text x="20" y="36">Окончание аксона</text><text x="576" y="91">Пузырьки</text><text x="616" y="147">Щель</text><text x="20" y="179">Рецепторы</text></g></svg><small>Условная схема химического синапса.</small></div>`}

boot();
</script></body></html>
